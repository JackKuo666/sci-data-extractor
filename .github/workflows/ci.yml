name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 mypy

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    - name: Type check with mypy
      run: |
        mypy extractor.py --ignore-missing-imports
      continue-on-error: true

    - name: Test import
      run: |
        python -c "import extractor; print('✓ extractor.py imports successfully')"
        python -c "import fitz; print('✓ PyMuPDF is available')"

    - name: Check script syntax
      run: |
        python -m py_compile extractor.py
        python -m py_compile batch_extract.py
        echo "✓ All scripts have valid syntax"

  validate-skill:
    name: Validate SKILL.md
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check SKILL.md exists
      run: |
        if [ ! -f "SKILL.md" ]; then
          echo "❌ SKILL.md not found!"
          exit 1
        fi
        echo "✓ SKILL.md exists"

    - name: Validate SKILL.md structure
      run: |
        # Check for required sections
        required_sections=("技能概述" "核心能力" "工作模式" "预设提取模板" "输出规范")
        for section in "${required_sections[@]}"; do
          if ! grep -q "$section" SKILL.md; then
            echo "❌ Required section '$section' not found in SKILL.md"
            exit 1
          fi
        done
        echo "✓ SKILL.md has all required sections"

  check-dependencies:
    name: Check dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check requirements.txt
      run: |
        if [ ! -f "requirements.txt" ]; then
          echo "❌ requirements.txt not found!"
          exit 1
        fi
        echo "✓ requirements.txt exists"

    - name: Validate requirements.txt
      run: |
        # Check for critical dependencies
        required_packages=("pymupdf" "openai")
        for package in "${required_packages[@]}"; do
          if ! grep -q "$package" requirements.txt; then
            echo "❌ Required package '$package' not found in requirements.txt"
            exit 1
          fi
        done
        echo "✓ All required packages are listed"

  documentation-check:
    name: Check documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check README files
      run: |
        if [ ! -f "README.md" ]; then
          echo "❌ README.md not found!"
          exit 1
        fi
        echo "✓ README.md exists"

        if [ ! -f "README_ZH.md" ]; then
          echo "❌ README_ZH.md not found!"
          exit 1
        fi
        echo "✓ README_ZH.md exists"

    - name: Check LICENSE
      run: |
        if [ ! -f "LICENSE" ]; then
          echo "❌ LICENSE not found!"
          exit 1
        fi
        echo "✓ LICENSE exists"

    - name: Check .env.example
      run: |
        if [ ! -f ".env.example" ]; then
          echo "❌ .env.example not found!"
          exit 1
        fi
        echo "✓ .env.example exists"

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
